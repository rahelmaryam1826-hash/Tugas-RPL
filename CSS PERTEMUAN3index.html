<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas Mandiri - 3 Kartu Produk</title>
  <style>
    /* Reset dasar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #F4F6F9;
      padding: 30px;
    }

    /* Box Model 3 Kartu Produk */
    .kartu-produk {
      box-sizing: border-box;       /* Menjaga total lebar tetap 280px */
      width: 280px;                 /* Lebar kartu */
      padding: 20px;                /* Jarak dalam */
      border: 2px solid #1F4E79;    /* Garis tepi */
      margin-top: 15px;             /* Jarak atas */
      margin-bottom: 25px;          /* Jarak bawah */
      background-color: #FFFFFF;
      border-radius: 6px;
    }

    .nama-produk {
      font-size: 18px;
      color: #1F4E79;
      margin-bottom: 8px;
    }

    .kategori {
      font-size: 13px;
      color: #666666;
      margin-bottom: 12px;
    }

    .harga {
      font-size: 16px;
      font-weight: bold;
      color: #2E7D32;
    }
  </style>
</head>
<body>

  <div class="kartu-produk">
    <h3 class="nama-produk">Router Wireless N300</h3>
    <p class="kategori">Perangkat Jaringan</p>
    <p class="harga">Rp 210.000</p>
  </div>

  <div class="kartu-produk">
    <h3 class="nama-produk">Kabel UTP Cat6 305m</h3>
    <p class="kategori">Media Transmisi</p>
    <p class="harga">Rp 850.000</p>
  </div>

  <div class="kartu-produk">
    <h3 class="nama-produk">Crimping Tool RJ45</h3>
    <p class="kategori">Peralatan Jaringan</p>
    <p class="harga">Rp 75.000</p>
  </div>

</body>
</html>
